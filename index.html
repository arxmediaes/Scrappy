<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARX MEDIA — Lead Scraper</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#0d0d0f;color:#f5f5f5;display:flex;min-height:100vh;align-items:center;justify-content:center}.card{width:min(620px,92vw);background:#151518;border:1px solid #29292d;border-radius:22px;padding:34px;box-shadow:0 20px 70px #0008}.brand{font-weight:700;letter-spacing:.16em;font-size:13px;color:#bbb;margin-bottom:8px}.title{font-size:34px;margin:0 0 8px}.sub{color:#999;margin:0 0 28px}label{display:block;font-size:13px;color:#bbb;margin:16px 0 7px}input,select{width:100%;background:#0f0f11;color:#fff;border:1px solid #303035;border-radius:11px;padding:13px 14px;font-size:15px;outline:none}button{width:100%;margin-top:26px;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;background:#fff;color:#111}button:disabled{opacity:.5}.status{margin-top:18px;padding:12px;border-radius:10px;background:#101012;color:#aaa;font-size:13px;min-height:42px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="card"><div class="brand">ARX MEDIA</div><h1 class="title">Universal Lead Scraper</h1><p class="sub">Encuentra, enriquece y analiza negocios automáticamente.</p><label>Nicho</label><input id="nicho" placeholder="Ej. clínicas, abogados, hoteles boutique"><div class="grid"><div><label>País</label><select id="pais"><option>España</option><option>Portugal</option><option>Francia</option><option>Italia</option><option>Alemania</option><option>Reino Unido</option><option>Chile</option><option>México</option><option>Estados Unidos</option></select></div><div><label>Ciudad / zona</label><input id="ciudad" placeholder="Ej. Valencia"></div></div><label>Número máximo de negocios</label><input id="cantidad" type="number" min="1" max="500" value="100"><button id="go">INICIAR SCRAPING</button><div class="status" id="status">Listo para comenzar.</div></main><script>const WEBHOOK_URL='PEGA_AQUI_LA_URL_PRODUCTION_DEL_WEBHOOK';const $=id=>document.getElementById(id);$('go').onclick=async()=>{if(WEBHOOK_URL.startsWith('PEGA_')){$('status').textContent='Primero coloca en WEBHOOK_URL la URL Production del nodo Dashboard Webhook de n8n.';return}if(!$('nicho').value.trim()){$('status').textContent='Indica un nicho antes de comenzar.';return}$('go').disabled=true;$('status').textContent='Enviando búsqueda a ARX MEDIA…';try{const r=await fetch(WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nicho:$('nicho').value.trim(),pais:$('pais').value,ciudad:$('ciudad').value.trim(),cantidad:Number($('cantidad').value)||100})});$('status').textContent=r.ok?'Scraping iniciado. Puedes cerrar esta ventana; n8n continuará procesando los leads.':'No se pudo iniciar el workflow ('+r.status+').';}catch(e){$('status').textContent='Error de conexión con n8n. Revisa la URL del webhook y CORS.'}finally{$('go').disabled=false}}</script></body></html>
