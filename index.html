<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ARX MEDIA — Lead Scraper</title>

<style>

* {
  box-sizing: border-box;
}

:root {
  --black: #080808;
  --surface: #101010;
  --surface-2: #141414;
  --border: #292929;

  --white: #f5f5f5;
  --gray: #8c8c8c;
  --gray-dark: #555;

  --purple: #a96cff;
  --lime: #d9f238;
}

/* =========================================================
   BASE
========================================================= */

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;

  background:
    radial-gradient(
      circle at 50% -20%,
      rgba(169,108,255,.08),
      transparent 35%
    ),
    var(--black);

  color: var(--white);

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 40px 20px;
}

/* =========================================================
   MAIN
========================================================= */

.wrapper {
  width: 100%;
  max-width: 610px;
}

/* =========================================================
   BRAND
========================================================= */

.brand {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 22px;

  padding: 0 3px;
}

.brand-name {
  display: flex;
  align-items: center;
  gap: 9px;

  font-size: 11px;
  font-weight: 700;

  letter-spacing: .20em;
}

.brand-point {
  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: var(--lime);
}

.brand-type {
  font-size: 9px;
  letter-spacing: .17em;

  color: #505050;
}

/* =========================================================
   CARD
========================================================= */

.card {
  position: relative;

  background: var(--surface);

  border: 1px solid var(--border);

  border-radius: 18px;

  padding: 42px;

  box-shadow:
    0 30px 80px rgba(0,0,0,.45);
}

/* línea superior muy discreta */

.card::before {
  content: "";

  position: absolute;

  top: -1px;
  left: 38px;
  right: 38px;

  height: 1px;

  background: linear-gradient(
    90deg,
    transparent,
    rgba(169,108,255,.7),
    transparent
  );
}

/* =========================================================
   HEADER
========================================================= */

.header {
  margin-bottom: 34px;
}

.eyebrow {
  margin-bottom: 13px;

  font-size: 10px;
  font-weight: 600;

  letter-spacing: .18em;
  text-transform: uppercase;

  color: var(--purple);
}

.title {
  margin: 0;

  font-size: 42px;
  line-height: 1.02;

  font-weight: 650;

  letter-spacing: -.045em;
}

.title span {
  color: var(--purple);
}

.description {
  max-width: 470px;

  margin: 15px 0 0;

  font-size: 13px;
  line-height: 1.6;

  color: var(--gray);
}

/* =========================================================
   FORM
========================================================= */

.form {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.field {
  width: 100%;
}

label {
  display: block;

  margin-bottom: 8px;

  font-size: 11px;
  font-weight: 600;

  color: #c7c7c7;
}

input,
select {
  width: 100%;
  height: 48px;

  padding: 0 14px;

  border: 1px solid var(--border);
  border-radius: 9px;

  background: #0b0b0b;

  color: var(--white);

  font-family: inherit;
  font-size: 13px;

  outline: none;

  transition:
    border-color .2s ease,
    background .2s ease;
}

input::placeholder {
  color: #4e4e4e;
}

input:hover,
select:hover {
  border-color: #363636;
}

input:focus,
select:focus {
  border-color: rgba(169,108,255,.75);

  background: #0d0d0d;
}

/* SELECT */

select {
  appearance: none;

  cursor: pointer;

  background-image:
    linear-gradient(45deg, transparent 50%, #777 50%),
    linear-gradient(135deg, #777 50%, transparent 50%);

  background-position:
    calc(100% - 16px) 20px,
    calc(100% - 11px) 20px;

  background-size:
    5px 5px,
    5px 5px;

  background-repeat: no-repeat;
}

select option {
  background: #111;
  color: white;
}

/* =========================================================
   TWO COLUMNS
========================================================= */

.row {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 14px;
}

/* =========================================================
   BUTTON
========================================================= */

button {
  width: 100%;
  height: 50px;

  margin-top: 4px;

  border: none;
  border-radius: 9px;

  background: var(--white);

  color: #090909;

  font-family: inherit;

  font-size: 11px;
  font-weight: 800;

  letter-spacing: .15em;

  cursor: pointer;

  transition:
    transform .18s ease,
    background .18s ease,
    box-shadow .18s ease;
}

button:hover {
  transform: translateY(-1px);

  background: #ffffff;

  box-shadow:
    0 10px 30px rgba(0,0,0,.35);
}

button:active {
  transform: translateY(0);
}

button:disabled {
  opacity: .5;
  cursor: wait;
}

/* =========================================================
   STATUS
========================================================= */

.status {
  display: flex;
  align-items: center;

  min-height: 44px;

  margin-top: 14px;

  padding: 0 13px;

  border: 1px solid #202020;
  border-radius: 8px;

  background: #0c0c0c;

  color: #777;

  font-size: 11px;
}

.status::before {
  content: "";

  width: 6px;
  height: 6px;

  margin-right: 9px;

  flex-shrink: 0;

  border-radius: 50%;

  background: var(--lime);
}

/* =========================================================
   FOOTER
========================================================= */

.footer {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-top: 30px;
  padding-top: 18px;

  border-top: 1px solid #202020;

  font-size: 9px;

  letter-spacing: .12em;

  color: #484848;
}

.footer-left {
  display: flex;
  align-items: center;
  gap: 7px;
}

.footer-dot {
  width: 5px;
  height: 5px;

  border-radius: 50%;

  background: var(--purple);
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

  body {
    padding: 22px 14px;
  }

  .card {
    padding: 30px 23px;

    border-radius: 15px;
  }

  .title {
    font-size: 34px;
  }

  .row {
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .footer {
    align-items: flex-start;

    flex-direction: column;

    gap: 10px;
  }
}

</style>
</head>


<body>

<div class="wrapper">

  <!-- BRAND -->

  <div class="brand">

    <div class="brand-name">
      <span class="brand-point"></span>
      ARX MEDIA
    </div>

    <div class="brand-type">
      LEAD INTELLIGENCE
    </div>

  </div>


  <!-- CARD -->

  <main class="card">

    <header class="header">

      <div class="eyebrow">
        Lead generation system
      </div>

      <h1 class="title">
        Universal Lead <span>Scraper</span>
      </h1>

      <p class="description">
        Encuentra, enriquece y analiza negocios automáticamente.
        Configura los parámetros de búsqueda y deja que el sistema haga el resto.
      </p>

    </header>


    <!-- FORM -->

    <div class="form">

      <div class="field">

        <label for="nicho">
          Nicho
        </label>

        <input
          id="nicho"
          type="text"
          placeholder="Ej. clínicas, abogados, hoteles boutique"
        >

      </div>


      <div class="row">

        <div class="field">

          <label for="pais">
            País
          </label>

          <select id="pais">

            <option>España</option>
            <option>Portugal</option>
            <option>Francia</option>
            <option>Italia</option>
            <option>Alemania</option>
            <option>Reino Unido</option>
            <option>Chile</option>
            <option>México</option>
            <option>Estados Unidos</option>

          </select>

        </div>


        <div class="field">

          <label for="ciudad">
            Ciudad / zona
          </label>

          <input
            id="ciudad"
            type="text"
            placeholder="Ej. Valencia"
          >

        </div>

      </div>


      <div class="field">

        <label for="cantidad">
          Número máximo de negocios
        </label>

        <input
          id="cantidad"
          type="number"
          min="1"
          max="500"
          value="100"
        >

      </div>


      <button id="go">
        INICIAR SCRAPING
      </button>

    </div>


    <!-- STATUS -->

    <div
      class="status"
      id="status"
    >
      Listo para comenzar.
    </div>


    <!-- FOOTER -->

    <div class="footer">

      <div class="footer-left">

        <span class="footer-dot"></span>

        PROCESAMIENTO AUTOMATIZADO · N8N

      </div>

      <div>
        ARX MEDIA © 2026
      </div>

    </div>

  </main>

</div>


<script>

const WEBHOOK_URL =
'https://caroyln-squeakier-syreeta.ngrok-free.dev/webhook/arx-lead-scraper';

const $ = id => document.getElementById(id);


$('go').onclick = async () => {

  if (WEBHOOK_URL.startsWith('PEGA_')) {

    $('status').textContent =
      'Primero coloca en WEBHOOK_URL la URL Production del nodo Dashboard Webhook de n8n.';

    return;
  }


  if (!$('nicho').value.trim()) {

    $('status').textContent =
      'Indica un nicho antes de comenzar.';

    return;
  }


  $('go').disabled = true;

  $('status').textContent =
    'Enviando búsqueda a ARX MEDIA…';


  try {

    const r = await fetch(
      WEBHOOK_URL,
      {
        method: 'POST',

        headers: {
          'Content-Type': 'application/json'
        },

        body: JSON.stringify({

          nicho:
            $('nicho').value.trim(),

          pais:
            $('pais').value,

          ciudad:
            $('ciudad').value.trim(),

          cantidad:
            Number($('cantidad').value) || 100

        })
      }
    );


    $('status').textContent =
      r.ok

        ? 'Scraping iniciado. Puedes cerrar esta ventana; n8n continuará procesando los leads.'

        : 'No se pudo iniciar el workflow (' +
          r.status +
          ').';


  } catch (e) {

    $('status').textContent =
      'Error de conexión con n8n. Revisa la URL del webhook y CORS.';


  } finally {

    $('go').disabled = false;

  }

};

</script>

</body>
</html>
