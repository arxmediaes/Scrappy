<!doctype html>

<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARX MEDIA — Lead Scraper</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #070708;
  --panel: #101012;
  --panel-2: #141417;
  --border: #28282e;
  --text: #f7f7f8;
  --muted: #8f8f98;
  --muted-2: #65656d;
  --purple: #a855f7;
  --purple-light: #c084fc;
  --lime: #d7ff3f;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 16px;

  font-family: Inter, Arial, sans-serif;
  color: var(--text);

  background:
    radial-gradient(
      circle at 15% 15%,
      rgba(168, 85, 247, .12),
      transparent 32%
    ),
    radial-gradient(
      circle at 85% 85%,
      rgba(215, 255, 63, .055),
      transparent 28%
    ),
    var(--bg);
}

/* ───────────── CONTAINER ───────────── */

.card {
  position: relative;
  width: min(680px, 94vw);

  padding: 42px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.035),
      rgba(255,255,255,.008)
    ),
    var(--panel);

  border: 1px solid rgba(255,255,255,.09);
  border-radius: 26px;

  box-shadow:
    0 35px 100px rgba(0,0,0,.65),
    0 0 80px rgba(168,85,247,.045);

  overflow: hidden;
}

/* Línea decorativa superior */

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;

  background: linear-gradient(
    90deg,
    transparent,
    var(--purple),
    var(--purple-light),
    var(--lime),
    transparent
  );

  opacity: .8;
}

/* Glow decorativo */

.card::after {
  content: "";
  position: absolute;
  width: 260px;
  height: 260px;

  right: -150px;
  top: -150px;

  background: var(--purple);
  opacity: .055;

  filter: blur(80px);
  pointer-events: none;
}

/* ───────────── BRAND ───────────── */

.brand-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 30px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;

  font-size: 12px;
  font-weight: 700;
  letter-spacing: .22em;
  color: #fff;
}

.brand-dot {
  width: 7px;
  height: 7px;

  border-radius: 50%;
  background: var(--lime);

  box-shadow:
    0 0 12px rgba(215,255,63,.65);
}

.version {
  font-size: 10px;
  letter-spacing: .16em;
  color: var(--muted-2);
}

/* ───────────── HEADER ───────────── */

.title {
  margin: 0;

  font-size: clamp(32px, 6vw, 48px);
  line-height: .98;
  letter-spacing: -.045em;
  font-weight: 750;
}

.title span {
  color: var(--purple-light);
}

.sub {
  max-width: 510px;

  margin: 15px 0 34px;

  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
}

/* ───────────── FORM ───────────── */

.form-section {
  margin-bottom: 20px;
}

label {
  display: block;

  margin: 0 0 8px 2px;

  color: #d7d7dc;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .02em;
}

.field {
  position: relative;
}

input,
select {
  width: 100%;
  height: 50px;

  padding: 0 15px;

  border-radius: 12px;
  border: 1px solid var(--border);

  background: rgba(8,8,10,.82);

  color: #fff;

  font-family: inherit;
  font-size: 14px;

  outline: none;

  transition:
    border-color .2s ease,
    box-shadow .2s ease,
    background .2s ease,
    transform .2s ease;
}

input::placeholder {
  color: #55555e;
}

input:hover,
select:hover {
  border-color: #3a3a43;
}

input:focus,
select:focus {
  border-color: rgba(168,85,247,.8);

  background: #0c0c0f;

  box-shadow:
    0 0 0 3px rgba(168,85,247,.08),
    0 0 30px rgba(168,85,247,.07);
}

/* Select */

select {
  appearance: none;
  cursor: pointer;

  background-image:
    linear-gradient(45deg, transparent 50%, #888 50%),
    linear-gradient(135deg, #888 50%, transparent 50%);
  background-position:
    calc(100% - 18px) 21px,
    calc(100% - 13px) 21px;
  background-size:
    5px 5px,
    5px 5px;
  background-repeat: no-repeat;
}

select option {
  background: #111114;
  color: #fff;
}

/* ───────────── GRID ───────────── */

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

/* ───────────── BUTTON ───────────── */

button {
  position: relative;

  width: 100%;
  height: 54px;

  margin-top: 10px;

  border: 0;
  border-radius: 13px;

  background:
    linear-gradient(
      100deg,
      #f4f4f4 0%,
      #ffffff 55%,
      #e9d5ff 100%
    );

  color: #09090b;

  font-family: inherit;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .17em;

  cursor: pointer;

  overflow: hidden;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    filter .2s ease;
}

button::before {
  content: "";
  position: absolute;
  inset: 0;

  background: linear-gradient(
    90deg,
    transparent,
    rgba(168,85,247,.20),
    transparent
  );

  transform: translateX(-100%);
  transition: transform .5s ease;
}

button:hover {
  transform: translateY(-2px);

  box-shadow:
    0 12px 35px rgba(168,85,247,.20),
    0 0 30px rgba(215,255,63,.06);
}

button:hover::before {
  transform: translateX(100%);
}

button:active {
  transform: translateY(0);
}

button:disabled {
  opacity: .5;
  cursor: wait;
  transform: none;
}

/* ───────────── STATUS ───────────── */

.status {
  display: flex;
  align-items: center;
  gap: 10px;

  min-height: 48px;

  margin-top: 14px;
  padding: 0 15px;

  border: 1px solid rgba(255,255,255,.07);
  border-radius: 12px;

  background: rgba(255,255,255,.018);

  color: var(--muted);

  font-size: 12px;
}

.status::before {
  content: "";

  flex: 0 0 auto;

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: var(--lime);

  box-shadow:
    0 0 12px rgba(215,255,63,.55);
}

/* ───────────── FOOTER ───────────── */

.footer {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-top: 32px;
  padding-top: 18px;

  border-top: 1px solid rgba(255,255,255,.06);

  color: var(--muted-2);

  font-size: 10px;
  letter-spacing: .08em;
}

.footer-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.footer-mark {
  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: var(--purple-light);
}

.footer-right {
  color: #45454d;
}

/* ───────────── MOBILE ───────────── */

@media(max-width:600px) {

  body {
    padding: 18px 12px;
  }

  .card {
    padding: 28px 22px;
    border-radius: 21px;
  }

  .brand-row {
    margin-bottom: 25px;
  }

  .title {
    font-size: 34px;
  }

  .sub {
    margin-bottom: 28px;
  }

  .grid {
    grid-template-columns: 1fr;
    gap: 0;
  }

  .footer {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }
}
</style>

</head>

<body>

<main class="card">

  <div class="brand-row">
    <div class="brand">
      <span class="brand-dot"></span>
      ARX MEDIA
    </div>

```
<div class="version">

  <div class="form-section">

</main>

<script>

const WEBHOOK_URL =
'https://caroyln-squeakier-syreeta.ngrok-free.dev/webhook/arx-lead-scraper';

const $ = id => document.getElementById(id);

$('go').onclick = async () => {

  if (WEBHOOK_URL.startsWith('PEGA_')) {

    $('status').textContent =
      'Primero coloca en WEBHOOK_URL la URL Production del nodo Dashboard Webhook de n8n.';

    return;
  }

  if (!$('nicho').value.trim()) {

    $('status').textContent =
      'Indica un nicho antes de comenzar.';

    return;
  }

  $('go').disabled = true;

  $('status').textContent =
    'Enviando búsqueda a ARX MEDIA…';

  try {

    const r = await fetch(
      WEBHOOK_URL,
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          nicho: $('nicho').value.trim(),
          pais: $('pais').value,
          ciudad: $('ciudad').value.trim(),
          cantidad:
            Number($('cantidad').value) || 100
        })
      }
    );

    $('status').textContent =
      r.ok
        ? 'Scraping iniciado. Puedes cerrar esta ventana; n8n continuará procesando los leads.'
        : 'No se pudo iniciar el workflow (' + r.status + ').';

  } catch (e) {

    $('status').textContent =
      'Error de conexión con n8n. Revisa la URL del webhook y CORS.';

  } finally {

    $('go').disabled = false;

  }

};

</script>

</html>
